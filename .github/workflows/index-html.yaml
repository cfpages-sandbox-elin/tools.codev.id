name: Update index.html from index.md

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.md]

concurrency:
  group: markdown-to-html-index-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pandoc

      - name: Render Markdown fragment
        run: pandoc index.md -t html5 -o "$RUNNER_TEMP/index-fragment.html"

      - name: Run installed regression test
        run: python -B .github/scripts/test_update_index_from_markdown_html.py

      - name: Update index and publish
        shell: bash
        run: |
          set -euo pipefail
          python -B .github/scripts/update_index_from_markdown_html.py index.html "$RUNNER_TEMP/index-fragment.html"
          mapfile -t dirty < <(git diff --name-only)
          for path in "${dirty[@]}"; do
            [[ "$path" == "index.html" ]] || { echo "unexpected dirty path: $path" >&2; exit 1; }
          done
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'Update index.html from index.md'
          git push origin HEAD:main
